# XcodeGen 설정: GitHub Actions(macOS)에서 `xcodegen generate`로 Ledger.xcodeproj를 만들어 빌드해요.
# 화면·엔진(Web 폴더)은 빌드 전에 `node tools/build-ios-web.js`가 만들어요.
name: Ledger
options:
  bundleIdPrefix: io.github.eastjuu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Ledger:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Web
        type: folder          # 폴더째 앱 안에 복사 (index.html, engine.js)
      - path: Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 가계부
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true              # 파일 앱 › 가계부 에 ledger.json·백업이 보여요
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eastjuu.ledger
        PRODUCT_NAME: Ledger
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"              # 서명은 설치 도구(SideStore/AltStore)가 내 Apple ID로 해요
        CODE_SIGNING_REQUIRED: "NO"
    scheme: {}
