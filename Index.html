<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>가계부</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--side:#1f2430;--side-fg:#c9ced8;--side-on:#fff;--side-hi:#2f3647;
  --fg:#1b1f27;--muted:#6b7280;--line:#e5e7eb;--line-strong:#1b1f27;
  --accent:#2f6fde;--accent-soft:#e8f0fd;--ok:#1a7f4b;--warn:#b26a00;--warn-soft:#fff6e5;--bad:#c62828;
  --c1:#2f6fde;--c2:#e2763a;--c3:#2aa198;--c4:#8e6bd8;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  --num:"SF Mono","Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14171d;--panel:#1c2028;--side:#0f1217;--side-fg:#9aa3b2;--side-on:#fff;--side-hi:#222835;
  --fg:#e6e8ec;--muted:#9097a3;--line:#2c313c;--line-strong:#e6e8ec;
  --accent:#6aa0ff;--accent-soft:#1f2b44;--ok:#4cc38a;--warn:#f0a43a;--warn-soft:#2e2615;--bad:#ff6b6b;
  --c1:#6aa0ff;--c2:#f08d55;--c3:#3cc3b5;--c4:#a98bf0;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;height:100dvh}

/* 사이드바 */
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-on);font-weight:700;font-size:16px;padding:4px 10px 18px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff}
.nav-g{font-size:11px;letter-spacing:.08em;color:#6c7486;padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav-i svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-i:hover{background:var(--side-hi)}
.nav-i.on{background:var(--side-hi);color:var(--side-on);font-weight:600}
.nav-i .key{margin-left:auto;font-size:11px;opacity:.45}
.side-foot{margin-top:auto;font-size:11px;color:#6c7486;padding:12px 10px 0;line-height:1.5}

/* 메인 */
.main{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap}
.period{display:flex;gap:6px;align-items:center}
.period[hidden]{display:none}
select,input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
.top .sp{flex:1}
.btn{text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn svg{width:15px;height:15px}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.upd{font-size:12px;color:var(--muted);white-space:nowrap}
.view{flex:1;overflow:auto;padding:20px 24px 28px}
.view-in{max-width:1100px;margin:0 auto}

/* 상태표시줄 */
.status{display:flex;gap:18px;align-items:center;padding:6px 24px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow-x:auto}
.status b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--ok)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.status .clickable{cursor:pointer}
.status .clickable:hover{color:var(--accent)}

/* 하단 탭바 (폰) */
.tabbar{display:none}
.seg{display:none}
@media (prefers-color-scheme:dark) and (max-width:860px){
  .tabbar{background:linear-gradient(180deg,rgba(44,49,60,.62),rgba(28,32,40,.5));border-color:rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)}
  .tabbar::before{background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.12),transparent 60%)}
  .tabbar button{color:#c3c8d2}
  .tabbar button.on{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
}

/* 카드·KPI */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);margin-bottom:6px}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:#fff}
.kpi.hero .l,.kpi.hero .v small{color:rgba(255,255,255,.8)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid2 .card{margin-bottom:0}

/* 자산 구성 */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:4px 0 14px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.legend>span:nth-child(odd){display:flex;align-items:center;gap:8px}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend>span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 표 */
.tbl-wrap{overflow:auto;max-height:calc(100dvh - 260px);border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 45%,transparent)}
.tbl tr.go{cursor:pointer}
.tbl tr.go:hover td{background:var(--accent-soft)}
.tbl tr.sel td{background:var(--accent-soft)}
.num{text-align:right!important;white-space:nowrap}
.muted{color:var(--muted)}
.neg{color:var(--bad)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.pending{background:var(--warn-soft);color:var(--warn)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctrl label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* 재무제표 양식 */
.fs-doc{max-width:760px;margin:0 auto;padding:28px 32px}
.fs-head{text-align:center;margin-bottom:18px}
.fs-head h2{display:block;font-size:22px;letter-spacing:.5em;margin:0 0 6px;padding-left:.5em;font-weight:700}
.fs-head p{margin:0;color:var(--muted);font-size:13px}
.fs-unit{text-align:right;color:var(--muted);font-size:12px;margin:0 0 4px}
table.fs{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.fs th{border-top:2px solid var(--line-strong);border-bottom:1px solid var(--line-strong);padding:8px;font-weight:600;text-align:center;white-space:nowrap}
.fs th span{display:block;font-weight:400;color:var(--muted);font-size:11px}
.fs td{padding:6px 8px}
.fs td.num{width:150px}
.fs .sec td{padding-top:14px;font-weight:700}
.fs .grp td{font-weight:600}
.fs .grp td:first-child{padding-left:18px}
.fs .acct td{color:var(--muted)}
.fs .acct td:first-child{padding-left:40px}
.fs .acct.go{cursor:pointer}
.fs .acct.go:hover td{background:var(--accent-soft);color:var(--accent)}
.fs .sum td{font-weight:600;border-top:1px solid var(--line)}
.fs .sum td:first-child{padding-left:18px}
.fs .total td{font-weight:700;border-top:1px solid var(--line-strong);border-bottom:3px double var(--line-strong);padding:9px 8px}
.fs .total td:first-child{text-align:center;letter-spacing:.2em}
.fs-note{font-size:12px;color:var(--muted);margin-top:14px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}

/* 차트 */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px}
.chart .gridl{stroke:var(--line)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;white-space:nowrap;line-height:1.6}
.bars .row{display:grid;grid-template-columns:minmax(80px,130px) 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.bars .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:5px;background:var(--c2)}
.bars .num{font-variant-numeric:tabular-nums}

/* 경고 */
.warnbox{border-color:var(--warn);background:var(--warn-soft)}
.warnbox h2{color:var(--warn)}

/* 상세 패널 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;z-index:21;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;box-shadow:-8px 0 30px rgba(0,0,0,.12);transition:transform .22s ease}
.dr-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-size:16px}
.dr-h .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.dr-b{padding:18px 20px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;font-size:13px;margin-bottom:18px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.je{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px;font-variant-numeric:tabular-nums}
.je th{background:var(--bg);padding:8px;text-align:left;font-weight:600;color:var(--muted);border:1px solid var(--line)}
.je td{padding:10px 8px;border:1px solid var(--line)}
.dr-acts{display:flex;flex-direction:column;gap:8px}
.dr-acts .btn{justify-content:center;padding:9px 12px}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}
.err{max-width:520px;margin:60px auto;text-align:center}
.err b{color:var(--bad)}

/* 폰 */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:30px 14px 10px;gap:8px}
  .top h1{font-size:17px}
  .upd{display:none}
  .view{padding:14px 12px 110px}
  .top{order:-2}
  .status{order:-1;padding:6px 14px;gap:14px;border-top:0;border-bottom:1px solid var(--line);font-size:11.5px}
  /* Liquid Glass 스타일 하단 바 */
  .tabbar{display:flex;position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;padding:6px;gap:2px;border-radius:30px;
    background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.42));
    -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 10px 30px rgba(15,23,42,.16),0 2px 6px rgba(15,23,42,.08),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 1px rgba(255,255,255,.35)}
  .tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.55),transparent 60%)}
  .tabbar button{position:relative;flex:1 1 0;min-width:0;white-space:nowrap;border:0;background:none;padding:7px 2px 6px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#3a3f4a;cursor:pointer;transition:background .2s,color .2s,transform .15s}
  .tabbar button:active{transform:scale(.94)}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent);font-weight:600;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 1px 4px rgba(15,23,42,.08)}
  .seg{display:flex;padding:3px;margin:0 0 14px;border-radius:12px;background:var(--line)}
  .seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:13px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .fs-doc{padding:18px 12px}
  .fs td.num{width:auto}
  .fs .acct td:first-child{padding-left:24px}
  .fs .grp td:first-child,.fs .sum td:first-child{padding-left:8px}
  .fs-head h2{letter-spacing:.3em}
  .fs .total td:first-child{letter-spacing:0;white-space:nowrap}
  .kpi .v{font-size:18px}
  .tbl-wrap{max-height:none}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i>₩</i>가계부</div>
    <div id="sidenav"></div>
    <div class="side-foot">구글 시트 '복식부기_가계부'를 읽어 보여주는 조회 전용 화면이에요.<br>입력·수정은 시트에서 해주세요.</div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title">요약</h1>
      <div class="period" id="period" hidden>
        <select id="yearSel" aria-label="연도"></select>
        <select id="monthSel" aria-label="월">
          <option value="0">연간</option>
          <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option><option value="4">4월</option>
          <option value="5">5월</option><option value="6">6월</option><option value="7">7월</option><option value="8">8월</option>
          <option value="9">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
        </select>
      </div>
      <span class="sp"></span>
      <span class="upd" id="upd"></span>
      <button class="btn" id="refresh" title="새로고침 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg><span class="hide-m">새로고침</span></button>
    </header>
    <div class="view" id="view"><div class="loading">불러오는 중…</div></div>
    <footer class="status" id="status"></footer>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-h"><h3 id="drTitle">전표</h3><button class="x" id="drClose" aria-label="닫기">×</button></div>
  <div class="dr-b" id="drBody"></div>
</aside>

<script>
/* ===== 메뉴 ===== */
const ICONS = {
  summary:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  bs:'<path d="M4 4h16v16H4z"/><path d="M12 4v16M4 12h16"/>',
  is:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  trial:'<path d="M4 6h16M4 12h16M4 18h16M9 3v18"/>',
  journal:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  ledger:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/>',
  monthly:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
};
const MENU = [
  { g:'개요', items:[['summary','요약']] },
  { g:'재무제표', items:[['bs','재무상태표'],['is','손익계산서'],['trial','시산표']] },
  { g:'장부', items:[['journal','전표 조회'],['ledger','계정별 원장']] },
  { g:'분석', items:[['monthly','월별 추이']] },
];
const ALL = MENU.flatMap((m) => m.items);
const PERIOD_VIEWS = ['bs','is','trial','monthly'];
const icon = (k) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[k] + '</svg>';

/* ===== 상태 ===== */
const S = { raw:null, D:null, view:'summary', y:null, m:0, account:null, q:'', st:'', nz:false, sel:null, loading:false, error:null };

/* ===== 도구 ===== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const acct = (n) => (Math.round(n) === 0 ? '-' : fmt(n));
const numCell = (n, f) => '<td class="num' + (n < 0 ? ' neg' : '') + (Math.round(n) === 0 ? ' muted' : '') + '">' + (f || acct)(n) + '</td>';
const num = (v) => { if (typeof v === 'number') return v; const t = String(v == null ? '' : v).replace(/[,\s원₩]/g, ''); if (t === '' || t === '-') return 0; const n = Number(t.replace(/^\((.*)\)$/, '-$1')); return Number.isFinite(n) ? n : 0; };
const txt = (v) => String(v == null ? '' : v).trim();
const DATE_RE = /^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/;
const dkey = (s) => { const m = DATE_RE.exec(s); return m ? m[1] + m[2].padStart(2,'0') + m[3].padStart(2,'0') : ''; };
const pad = (n) => String(n).padStart(2, '0');

/* ===== 데이터 가공 ===== */
function build(raw) {
  const GROUPS = { '현금및예금':'cash', '적금':'savings', '투자자산':'invest', '기타자산':'other' };
  const accounts = raw.accounts.filter((r) => txt(r[1])).map((r) => {
    const a = { code:num(r[0]), name:txt(r[1]), type:txt(r[2]), side:txt(r[3]), fsg:txt(r[4]) };
    let g = { '부채':'liab', '자본':'equity', '수익':'rev', '비용':'exp' }[a.type] || 'etc';
    if (a.type === '자산') g = GROUPS[a.fsg] || (a.code >= 150 && a.code < 170 ? 'savings' : a.code >= 170 && a.code < 200 ? 'invest' : a.code >= 100 && a.code < 120 ? 'cash' : 'other');
    a.group = g;
    a.sgn = a.side === '차변' ? 1 : -1;
    return a;
  }).sort((x, y) => x.code - y.code);
  const byName = new Map(accounts.map((a) => [a.name, a]));

  const journal = [];
  raw.journal.forEach((r, i) => {
    if (![1,2,3,4].some((k) => txt(r[k]) !== '')) return;
    const e = { row:i + 2, no:txt(r[0]), date:txt(r[1]), debit:txt(r[2]), credit:txt(r[3]), amount:num(r[4]), memo:txt(r[5]), check:txt(r[9]), confirm:txt(r[10]) };
    e.dk = dkey(e.date);
    e.ym = e.dk ? Number(e.dk.slice(0, 6)) : 0;
    const p = [];
    if (!e.dk) p.push(e.date ? '날짜 형식 (' + e.date + ')' : '날짜 빈칸');
    if (!e.debit) p.push('차변 계정 빈칸'); else if (!byName.has(e.debit)) p.push('계정과목표에 없는 차변 계정: ' + e.debit);
    if (!e.credit) p.push('대변 계정 빈칸'); else if (!byName.has(e.credit)) p.push('계정과목표에 없는 대변 계정: ' + e.credit);
    if (!(e.amount > 0)) p.push('금액이 0이거나 빈칸');
    if (e.debit && e.debit === e.credit) p.push('차변·대변이 같은 계정');
    if (e.check && e.check !== 'OK') p.push('시트 검증: ' + e.check);
    e.problems = p;
    e.valid = !p.some((x) => !x.startsWith('시트 검증'));
    journal.push(e);
  });
  const valid = journal.filter((e) => e.valid);
  const flows = new Map(accounts.map((a) => [a.name, []]));
  valid.forEach((e) => { flows.get(e.debit).push([e.ym, e.amount, 0]); flows.get(e.credit).push([e.ym, 0, e.amount]); });
  const years = [...new Set(valid.map((e) => Math.floor(e.ym / 100)))].sort((a, b) => a - b);

  // 원장: 계정별 날짜순 누적 잔액
  const ledger = new Map();
  accounts.forEach((a) => {
    const lines = [];
    valid.forEach((e, i) => {
      if (e.debit === a.name) lines.push({ e, i, d:e.amount, c:0, counter:e.credit });
      if (e.credit === a.name) lines.push({ e, i, d:0, c:e.amount, counter:e.debit });
    });
    lines.sort((x, y) => (x.e.dk < y.e.dk ? -1 : x.e.dk > y.e.dk ? 1 : x.i - y.i));
    let bal = 0;
    lines.forEach((l) => { bal += a.sgn * (l.d - l.c); l.bal = bal; });
    ledger.set(a.name, lines);
  });
  return { accounts, byName, journal, valid, flows, years, ledger, issues:journal.filter((e) => e.problems.length), gid:raw.journalGid, sid:raw.spreadsheetId, at:raw.at };
}

/* 기간: 연간이면 1~12월, 월이면 그 달. 비교 기간은 전년/전월 */
function period() {
  const y = S.y, m = S.m;
  const cur = m ? { s:y * 100 + m, e:y * 100 + m } : { s:y * 100 + 1, e:y * 100 + 12 };
  const pm = m === 1 ? { y:y - 1, m:12 } : { y, m:m - 1 };
  const prev = m ? { s:pm.y * 100 + pm.m, e:pm.y * 100 + pm.m } : { s:(y - 1) * 100 + 1, e:(y - 1) * 100 + 12 };
  const lbl = m ? y + '.' + pad(m) : String(y);
  const plbl = m ? pm.y + '.' + pad(pm.m) : String(y - 1);
  return { cur, prev, lbl, plbl };
}
/* 계정별: 기간 말 누계 차변·대변·잔액, 기간 중 발생액 */
function acctAt(a, r) {
  let d = 0, c = 0, amt = 0;
  S.D.flows.get(a.name).forEach(([ym, dd, cc]) => {
    if (ym <= r.e) { d += dd; c += cc; }
    if (ym >= r.s && ym <= r.e) amt += a.sgn * (dd - cc);
  });
  return { d, c, bal:a.sgn * (d - c), amt };
}
function totals(r) {
  const t = { cash:0, savings:0, invest:0, other:0, assets:0, liab:0, capital:0, retained:0, rev:0, exp:0, dsum:0, csum:0 };
  S.D.accounts.forEach((a) => {
    const v = acctAt(a, r);
    t.dsum += v.d; t.csum += v.c;
    if (a.type === '자산') { t.assets += v.bal; t[a.group] += v.bal; }
    else if (a.type === '부채') t.liab += v.bal;
    else if (a.type === '자본') t.capital += v.bal;
    else if (a.type === '수익') { t.retained += v.bal; t.rev += v.amt; }
    else if (a.type === '비용') { t.retained -= v.bal; t.exp += v.amt; }
  });
  t.equity = t.capital + t.retained;
  t.liabEq = t.liab + t.equity;
  t.net = t.rev - t.exp;
  t.ok = Math.round(t.dsum) === Math.round(t.csum) && Math.round(t.assets) === Math.round(t.liabEq);
  return t;
}
function dateLabels(y, m) {
  const start = new Date(y, m ? m - 1 : 0, 1);
  let end = m ? new Date(y, m, 0) : new Date(y, 11, 31);
  const today = new Date();
  if (end > today && start <= today) end = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const k = (d) => d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  return { start:k(start), end:k(end) };
}

      '<div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="l">현재 잔액</div><div class="v' + (bal < 0 ? ' neg' : '') + '">' + fmt(bal) + '<small>원</small></div></div><div class="kpi"><div class="l">거래 건수</div><div class="v">' + lines.length + '<small>건</small></div></div></div>' +
      (lines.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>전표</th><th>상대 계정</th><th class="hide-m">적요</th><th class="num">차변</th><th class="num">대변</th><th class="num">잔액</th></tr></thead><tbody>' +
      lines.map((l) => '<tr class="go" data-entry="' + l.e.row + '"><td>' + esc(l.e.date) + '</td><td class="muted">' + esc(l.e.no) + '</td><td>' + esc(l.counter) + '</td><td class="hide-m muted">' + esc(l.e.memo) + '</td>' + numCell(l.d) + numCell(l.c) + numCell(l.bal, fmt) + '</tr>').join('') +
      '</tbody></table></div>' : '<div class="empty">이 계정에는 아직 전표가 없어요</div>') + '</div>';
  },

  monthly() {
    const P = period(), D = S.D;
    const months = [];
    let ytd = 0;
    for (let m = 1; m <= 12; m++) { const t = totals({ s:S.y * 100 + m, e:S.y * 100 + m }); ytd += t.net; months.push({ m, rev:t.rev, exp:t.exp, net:t.net, ytd }); }
    S.months = months;
    const exps = D.accounts.filter((a) => a.type === '비용').map((a) => [a, acctAt(a, P.cur).amt]).filter((x) => x[1] > 0).sort((x, y) => y[1] - x[1]);
    const max = exps.length ? exps[0][1] : 1;
    const any = months.some((x) => x.rev || x.exp);
    return '<div class="card"><h2>월별 수익과 비용<span class="sub">' + S.y + '년</span></h2>' + (any ? '<div class="chart" id="chart"></div>' : '<div class="empty">이 연도에는 아직 수익·비용 거래가 없어요</div>') + '</div>' +
      '<div class="grid2"><div class="card"><h2>비용 계정별<span class="sub">' + P.lbl + '</span></h2>' + (exps.length ? '<div class="bars">' +
      exps.map(([a, v]) => '<div class="row go" data-acct="' + esc(a.name) + '" style="cursor:pointer"><span>' + esc(a.name) + '</span><span class="t"><i style="width:' + (v / max * 100) + '%"></i></span><span class="num">' + fmt(v) + '</span></div>').join('') + '</div>' : '<div class="empty">이 기간에는 비용이 없어요</div>') + '</div>' +
      '<div class="card"><h2>월별 표</h2><table class="tbl"><thead><tr><th>월</th><th class="num">수익</th><th class="num">비용</th><th class="num">순손익</th><th class="num">연 누적</th></tr></thead><tbody>' +
      months.map((x) => '<tr><td>' + x.m + '월</td>' + numCell(x.rev) + numCell(x.exp) + numCell(x.net) + numCell(x.ytd) + '</tr>').join('') + '</tbody></table></div></div>';
  },
};
const badge = (e) => e.problems.length && !e.valid ? '<span class="badge pending">오류</span>' : e.confirm === '미확인' ? '<span class="badge pending">미확인</span>' : '<span class="badge">' + esc(e.confirm || '-') + '</span>';

function drawChart() {
  const el = $('chart');
  if (!el) return;
  const rows = S.months;
  const W = Math.max(300, el.clientWidth), H = 240, L = 54, B = 26;
  const max = Math.max(1, ...rows.map((r) => Math.max(r.rev, r.exp)));
  const step = Math.pow(10, Math.floor(Math.log10(max))) / 2;
  const top = Math.ceil(max / step) * step;
  const ticks = [0, .25, .5, .75, 1].map((f) => top * f);
  const y = (v) => H - B - (v / top) * (H - B - 10);
  const bw = (W - L - 8) / 12;
  const comp = new Intl.NumberFormat('ko-KR', { notation:'compact', maximumFractionDigits:1 });
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="월별 수익과 비용">';
  ticks.forEach((t) => { s += '<line class="gridl" x1="' + L + '" x2="' + (W - 8) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (L - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + comp.format(t) + '</text>'; });
  rows.forEach((r, i) => {
    const x0 = L + i * bw + bw * .15, w = bw * .34;
    s += '<rect x="' + x0 + '" y="' + y(r.rev) + '" width="' + w + '" height="' + (H - B - y(r.rev)) + '" rx="3" fill="var(--c1)"/>';
    s += '<rect x="' + (x0 + w + bw * .02) + '" y="' + y(r.exp) + '" width="' + w + '" height="' + (H - B - y(r.exp)) + '" rx="3" fill="var(--c2)"/>';
    s += '<text x="' + (L + i * bw + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + r.m + '</text>';
    s += '<rect data-m="' + i + '" x="' + (L + i * bw) + '" y="0" width="' + bw + '" height="' + (H - B) + '" fill="transparent"/>';
  });
  s += '</svg>';
  el.innerHTML = '<div style="display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c1);margin-right:5px"></i>수익</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c2);margin-right:5px"></i>비용</span></div>' + s + '<div class="tip" hidden></div>';
  const tip = el.querySelector('.tip');
  el.querySelectorAll('rect[data-m]').forEach((r) => {
    const show = (ev) => {
      const m = rows[Number(r.dataset.m)];
      tip.innerHTML = '<b>' + m.m + '월</b><br>수익 ' + fmt(m.rev) + '원<br>비용 ' + fmt(m.exp) + '원<br>순손익 ' + fmt(m.net) + '원';
      tip.hidden = false;
      const b = el.getBoundingClientRect();
      tip.style.left = Math.max(0, Math.min(ev.clientX - b.left + 12, el.clientWidth - tip.offsetWidth)) + 'px';
      tip.style.top = '24px';
    };
    r.addEventListener('pointermove', show);
    r.addEventListener('pointerdown', show);
    r.addEventListener('pointerleave', () => { tip.hidden = true; });
  });
}

/* ===== 전표 상세 패널 ===== */
function openEntry(row) {
  const e = S.D.journal.find((x) => x.row === row);
  if (!e) return;
  S.sel = row;
  $('drTitle').textContent = '전표 ' + (e.no || '(번호 없음)');
  const url = 'https://docs.google.com/spreadsheets/d/' + S.D.sid + '/edit#gid=' + S.D.gid + '&range=A' + e.row + ':K' + e.row;
  $('drBody').innerHTML =
    '<dl class="kv"><dt>날짜</dt><dd>' + esc(e.date) + '</dd><dt>확인 상태</dt><dd>' + badge(e) + '</dd><dt>시트 위치</dt><dd>분개장 ' + e.row + '행</dd><dt>적요</dt><dd>' + (esc(e.memo) || '<span class="muted">없음</span>') + '</dd></dl>' +
    (e.problems.length ? '<div class="card warnbox" style="padding:12px 14px"><b style="color:var(--warn)">확인 필요</b><div style="margin-top:4px">' + esc(e.problems.join(', ')) + '</div></div>' : '') +
    '<table class="je"><thead><tr><th>차변</th><th class="num">금액</th><th>대변</th><th class="num">금액</th></tr></thead><tbody><tr><td>' + esc(e.debit) + '</td><td class="num">' + fmt(e.amount) + '</td><td>' + esc(e.credit) + '</td><td class="num">' + fmt(e.amount) + '</td></tr></tbody></table>' +
    '<div class="dr-acts">' +
    (S.D.byName.has(e.debit) ? '<button class="btn" data-acct="' + esc(e.debit) + '">' + esc(e.debit) + ' 원장 보기</button>' : '') +
    (S.D.byName.has(e.credit) && e.credit !== e.debit ? '<button class="btn" data-acct="' + esc(e.credit) + '">' + esc(e.credit) + ' 원장 보기</button>' : '') +
    '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">시트에서 이 행 열기 ↗</a></div>';
  $('drawer').classList.add('on');
  $('drawer').setAttribute('aria-hidden', 'false');
  $('scrim').classList.add('on');
}
function closeEntry() {
  S.sel = null;
  $('drawer').classList.remove('on');
  $('drawer').setAttribute('aria-hidden', 'true');
  $('scrim').classList.remove('on');
}

/* ===== 이동·이벤트 ===== */
function go(view, opts) {
  S.view = view;
  Object.assign(S, opts || {});
  closeEntry();
  render();
  $('view').scrollTop = 0;
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-go],[data-acct],[data-entry],[data-act]');
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go, t.dataset.st ? { st:t.dataset.st } : {}); return; }
  if (t.dataset.acct) { go('ledger', { account:t.dataset.acct }); return; }
  if (t.dataset.entry) { openEntry(Number(t.dataset.entry)); return; }
  if (t.dataset.act === 'reload') load();
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'yearSel') { S.y = Number(t.value); render(); }
  else if (t.id === 'monthSel') { S.m = Number(t.value); render(); }
  else if (t.id === 'st') { S.st = t.value; render(); }
  else if (t.id === 'acctSel') { S.account = t.value; render(); }
  else if (t.dataset.act === 'nz') { S.nz = t.checked; render(); }
});
let qTimer;
document.addEventListener('input', (ev) => {
  if (ev.target.id !== 'q') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    S.q = ev.target.value;
    const pos = ev.target.selectionStart;
    render();
    const q = $('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  }, 200);
});
$('scrim').addEventListener('click', closeEntry);
$('drClose').addEventListener('click', closeEntry);
$('refresh').addEventListener('click', load);
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { closeEntry(); return; }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const n = Number(ev.key);
  if (n >= 1 && n <= ALL.length) go(ALL[n - 1][0]);
  if (ev.key === 'r' || ev.key === 'R') load();
});
let rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (S.view === 'monthly') drawChart(); }, 150); });

/* ===== 불러오기 ===== */
function load() {
  if (S.loading) return;
  S.loading = true;
  $('refresh').classList.add('spin');
  withKey((key) => google.script.run
    .withSuccessHandler((raw) => {
      S.loading = false; S.error = null;
      $('refresh').classList.remove('spin');
      try {
        S.D = build(raw);
        if (!S.y || !S.D.years.includes(S.y)) S.y = S.D.years[S.D.years.length - 1] || new Date().getFullYear();
      } catch (err) { S.error = err.message; }
      if (S.sel) { const r = S.sel; render(); openEntry(r); } else render();
    })
    .withFailureHandler((err) => {
      S.loading = false;
      $('refresh').classList.remove('spin');
      S.error = (err && err.message) || String(err);
      render();
    })
    .getData(key));
}
/* 접속 키: 웹앱 주소의 ?k= 값을 읽어 서버에 함께 보냅니다 */
let APP_KEY = null;
function withKey(cb) {
  if (APP_KEY !== null) return cb(APP_KEY);
  if (!(window.google && google.script && google.script.url)) { APP_KEY = ''; return cb(APP_KEY); }
  google.script.url.getLocation((loc) => { APP_KEY = (loc && loc.parameter && loc.parameter.k) || ''; cb(APP_KEY); });
}
render();
load();
</script>
</body>
